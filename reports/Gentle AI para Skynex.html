<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <meta name="theme-color" content="#f5f4f0">
  <title>Gentle AI para Skynex — informe interactivo</title>
  <style>
    :root{color-scheme:light;--bg:#f5f4f0;--paper:#fff;--ink:#20231f;--muted:#626960;--line:#e1e3dc;--accent:#27745f;--accent-soft:#e7f2ed;--code:#f0f1ed;--shadow:0 14px 44px #25372b0d;--text-size:16px}
    [data-theme="dark"]{color-scheme:dark;--bg:#171a18;--paper:#202522;--ink:#e9eee9;--muted:#aab4ac;--line:#39423c;--accent:#81c8a8;--accent-soft:#263b31;--code:#292f2b;--shadow:0 14px 44px #0004}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:var(--text-size)/1.68 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .2s,color .2s}
    button,input{font:inherit}.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.toolbar{max-width:1480px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:10px}.brand{font-weight:750;letter-spacing:-.03em;margin-right:auto}.brand span{color:var(--accent)}.control{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer}.control:hover,.control:focus-visible{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 25%,transparent)}.font-controls{display:flex;gap:5px}.search{width:min(31vw,320px);border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);padding:8px 12px}.layout{max-width:1480px;margin:32px auto;padding:0 24px;display:grid;grid-template-columns:245px minmax(0,900px);gap:36px;justify-content:center}.toc{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding:18px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow)}.toc h2{margin:0 0 10px;font-size:.78rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.toc a{display:block;color:var(--muted);text-decoration:none;font-size:.88rem;line-height:1.35;padding:7px 9px;border-radius:7px}.toc a:hover,.toc a.active{background:var(--accent-soft);color:var(--accent)}.toc a[hidden]{display:none}.article{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(24px,5vw,58px);box-shadow:var(--shadow);--article-size:1em}.article h1{font-size:clamp(2rem,4.2vw,3.4rem);line-height:1.12;letter-spacing:-.045em;margin:0 0 25px}.article h2{font-size:clamp(1.45rem,2.5vw,2rem);line-height:1.2;letter-spacing:-.025em;margin:2.8em 0 .8em;padding-top:.45em;border-top:1px solid var(--line);scroll-margin-top:90px}.article section:first-of-type h2{margin-top:1em}.article h3{line-height:1.3}.article p,.article li{font-size:var(--article-size);color:var(--ink)}.article p{margin:.8em 0 1.05em}.article strong{font-weight:720}.article a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}.article code{font: .88em ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code);padding:.12em .34em;border-radius:5px;overflow-wrap:anywhere}.article ul,.article ol{padding-left:1.35em}.article li{padding-left:.2em;margin:.45em 0}.table-wrap{overflow-x:auto;margin:1.2em 0 1.8em;border:1px solid var(--line);border-radius:10px}.article table{border-collapse:collapse;width:100%;min-width:920px;font-size:.9em;line-height:1.5}.article th,.article td{text-align:left;vertical-align:top;padding:12px 13px;border-bottom:1px solid var(--line)}.article th{background:var(--accent-soft);color:var(--ink);font-weight:720}.article tr:last-child td{border-bottom:0}.article blockquote{border-left:3px solid var(--accent);padding-left:16px;color:var(--muted)}.error{padding:20px;border:1px solid #c55;border-radius:10px;color:#a22}.status{font-size:.84rem;color:var(--muted);margin:0 0 12px}.no-results{display:none;padding:12px;border-radius:8px;background:var(--accent-soft);color:var(--muted)}footer{max-width:950px;margin:18px auto 42px;padding:0 24px;color:var(--muted);font-size:.84rem;text-align:center}
    @media(max-width:900px){.layout{grid-template-columns:1fr;gap:16px;margin-top:16px}.toc{position:relative;top:auto;max-height:210px}.toc nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.search{width:min(40vw,260px)}}@media(max-width:600px){.toolbar{padding:10px 12px;gap:6px}.brand{font-size:.86rem}.search{width:34vw;padding:7px}.control{padding:7px 8px}.layout{padding:0 10px}.article{padding:22px 18px;border-radius:12px}.toc nav{grid-template-columns:1fr}.font-controls{display:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><div class="toolbar">
    <div class="brand">SKYNEX <span>·</span> INVESTIGACIÓN</div>
    <input id="search" class="search" type="search" placeholder="Buscar en el informe…" aria-label="Buscar en el informe">
    <div class="font-controls" aria-label="Tamaño del texto"><button class="control" id="smaller" aria-label="Reducir texto">A−</button><button class="control" id="larger" aria-label="Aumentar texto">A+</button></div>
    <button class="control" id="theme" aria-label="Cambiar tema">☾</button>
    <a class="control" href="./Gentle%20AI%20para%20Skynex.md" target="_blank" rel="noopener">Ver Markdown ↗</a>
  </div></header>
  <div class="layout">
    <aside class="toc" aria-label="Tabla de contenidos"><h2>En este informe</h2><nav id="toc"></nav></aside>
    <main id="article" class="article" aria-live="polite"><p class="status">Cargando el informe…</p></main>
  </div>
  <footer>Informe Gentle AI para Skynex v2 · vista interactiva del Markdown original</footer>
  <script>
    (()=>{
      const article=document.getElementById('article'),toc=document.getElementById('toc');
      const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const inline=s=>s.split(/(`[^`]+`|\[[^\]]+\]\([^)]+\)|\*\*.+?\*\*)/g).map(part=>{
        if(part.startsWith('`'))return '<code>'+esc(part.slice(1,-1))+'</code>';
        if(part.startsWith('**'))return '<strong>'+esc(part.slice(2,-2))+'</strong>';
        const link=part.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
        if(link){let url;try{url=new URL(link[2],location.href)}catch{return esc(part)}if(!['http:','https:'].includes(url.protocol))return esc(part);const external=url.origin!==location.origin;return '<a href="'+esc(url.href)+'"'+(external?' target="_blank" rel="noopener noreferrer"':'')+'>'+esc(link[1])+'</a>'}
        return esc(part)
      }).join('');
      const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      const isTableLine=s=>/^\s*\|.*\|\s*$/.test(s);
      const cells=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
      function render(md){
        const lines=md.replace(/\r/g,'').split('\n');let i=0,html='',section=0,used=new Set();
        const ensureSection=()=>{if(!section){section=1;html+='<section class="report-section" id="introduccion">'}},closeSection=()=>{if(section){html+='</section>';section=0}};
        while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue}
          const heading=line.match(/^(#{1,3})\s+(.+)$/);if(heading){const n=heading[1].length,text=heading[2].replace(/\s+#+\s*$/,'');if(n===1){closeSection();html+='<h1>'+inline(text)+'</h1>';i++;continue}if(n===2){closeSection();section++;let id=slug(text)||'seccion';if(used.has(id))id+='-'+section;used.add(id);html+='<section class="report-section" id="'+id+'"><h2>'+inline(text)+'</h2>';const a=document.createElement('a');a.href='#'+id;a.textContent=text;toc.appendChild(a);i++;continue}ensureSection();html+='<h3>'+inline(text)+'</h3>';i++;continue}
          if(isTableLine(line)&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){ensureSection();const head=cells(line);i+=2;let rows='';while(i<lines.length&&isTableLine(lines[i])){const row=cells(lines[i]);rows+='<tr>'+head.map((_,j)=>'<td>'+(row[j]?inline(row[j]):'')+'</td>').join('')+'</tr>';i++}html+='<div class="table-wrap" role="region" aria-label="Tabla de adopción, desplazable horizontalmente" tabindex="0"><table><thead><tr>'+head.map(c=>'<th scope="col">'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';continue}
          const list=line.match(/^\s*([-*+] |\d+\. )(.*)$/);if(list){ensureSection();const ordered=/^\s*\d+\./.test(line),tag=ordered?'ol':'ul';html+='<'+tag+'>';while(i<lines.length){const m=lines[i].match(/^\s*([-*+] |\d+\. )(.*)$/);if(!m||(/^\s*\d+\./.test(lines[i]))!==ordered)break;html+='<li>'+inline(m[2])+'</li>';i++}html+='</'+tag+'>';continue}
          if(/^\s*---+\s*$/.test(line)){i++;continue}
          ensureSection();let para=[];while(i<lines.length&&lines[i].trim()&&!/^(#{1,3})\s+/.test(lines[i])&&!isTableLine(lines[i])&&!/^\s*([-*+] |\d+\. )/.test(lines[i])&&!/^\s*---+\s*$/.test(lines[i])){para.push(lines[i].trim());i++}html+='<p>'+inline(para.join(' '))+'</p>'
        }
        closeSection();article.innerHTML=html;
        document.querySelectorAll('.report-section').forEach(s=>{s.dataset.text=s.textContent.toLocaleLowerCase('es')});
      }
      fetch('./Gentle%20AI%20para%20Skynex.md').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(render).catch(e=>{article.innerHTML='<p class="error">No se pudo cargar el Markdown junto a esta página ('+esc(e.message)+'). Sirve la carpeta <code>reports</code> por HTTP para ver el informe.</p>'});
      const search=document.getElementById('search');search.addEventListener('input',()=>{const q=search.value.trim().toLocaleLowerCase('es');let shown=0;document.querySelectorAll('.report-section').forEach(s=>{const visible=!q||s.dataset.text.includes(q);s.hidden=!visible;if(visible)shown++});document.querySelectorAll('#toc a').forEach(a=>{const target=document.querySelector(a.getAttribute('href'));a.hidden=!!q&&(!target||target.hidden)});let note=document.getElementById('no-results');if(!note){note=document.createElement('p');note.id='no-results';note.className='no-results';article.prepend(note)}note.textContent='No hay secciones que coincidan con «'+search.value+'».';note.style.display=q&&shown===0?'block':'none'});
      const root=document.documentElement;let size=16;document.getElementById('larger').onclick=()=>{size=Math.min(21,size+1);root.style.setProperty('--text-size',size+'px')};document.getElementById('smaller').onclick=()=>{size=Math.max(14,size-1);root.style.setProperty('--text-size',size+'px')};
      const theme=document.getElementById('theme');let saved;try{saved=localStorage.getItem('gentle-report-theme')}catch{}if(saved==='dark')root.dataset.theme='dark';const syncTheme=()=>{theme.textContent=root.dataset.theme==='dark'?'☀':'☾';theme.setAttribute('aria-label',root.dataset.theme==='dark'?'Cambiar a tema claro':'Cambiar a tema oscuro')};syncTheme();theme.onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('gentle-report-theme',root.dataset.theme)}catch{}syncTheme()};
      const links=[...toc.querySelectorAll('a')];const observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){links.forEach(a=>a.classList.toggle('active',a.hash==='#'+e.target.id))}},{rootMargin:'-12% 0px -75% 0px'});const watch=()=>document.querySelectorAll('.report-section h2').forEach(h=>observer.observe(h));const mo=new MutationObserver(watch);mo.observe(toc,{childList:true});
    })();
  </script>
</body>
</html>
